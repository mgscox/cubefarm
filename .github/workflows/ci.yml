name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same PR or branch cancels the run it replaces.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }})
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        # Windows and macOS too: people run the office on both (paths, child processes, terminals, git worktrees).
        include:
          - os: ubuntu-latest
            platform: Linux
          - os: windows-latest
            platform: Windows
          - os: macos-latest
            platform: macOS
    runs-on: [self-hosted, '${{ matrix.platform }}', cubefarm]
    timeout-minutes: 45
    env:
      # Never let anything in CI look at a real office's state or ports.
      SWARM_HOME: ${{ github.workspace }}/.ci-swarm-home
      SWARM_PORT: '0'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --maxWorkers=2
      - run: npm run build
      # The npm package as users get it: packed, installed into an empty folder and booted in demo mode.
      - run: node scripts/smoke-package.mjs

  # The built app in a real browser: a demo office boots, renders, and its panels open (e2e/, Playwright).
  e2e:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, cubefarm]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm ci
      - run: npx playwright install chromium

      # playwright.config.ts builds the app and boots a demo office on a test port with a temp SWARM_HOME.
      - run: npm run test:e2e

      - name: Retain browser diagnostics
        if: ${{ always() }}
        env:
          CI_ARTIFACT_NAME: cubefarm-e2e
          CI_ARTIFACT_PATHS: |-
            playwright-report/**
            test-results/**
          CI_ARTIFACT_RETENTION_DAYS: '14'
          CI_ARTIFACT_REQUIRED: 'false'
        run: node scripts/retain-ci-artifacts.mjs
