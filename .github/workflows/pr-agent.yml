name: PR Agent

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review]
  issue_comment:
    types: [created]

jobs:
  review:
    if: >-
      github.event.sender.type == 'User' && (
        (github.event_name == 'pull_request_target' &&
          !github.event.pull_request.draft &&
          github.event.pull_request.head.repo.full_name == github.repository) ||
        (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
          github.event.issue.state == 'open' &&
          contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
          (github.event.comment.body == '/review' || github.event.comment.body == '/improve'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      # PR-Agent reads the diff through the API. This job never checks out PR code.
      - name: Review and suggest fixes
        uses: docker://pragent/pr-agent@sha256:548e894a88071180832b2f4233f734d0acd0db1a879e2fcbaa70bac8b8372ebe # 0.50.0-github_action
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPENROUTER__KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CONFIG__MODEL: openrouter/z-ai/glm-5.3-flash
          CONFIG__FALLBACK_MODELS: 'openrouter/deepseek/deepseek-v4.1-flash-1017'
          CONFIG__CUSTOM_MODEL_MAX_TOKENS: '1048576'
          GITHUB_ACTION_CONFIG__AUTO_DESCRIBE: 'false'
          GITHUB_ACTION_CONFIG__AUTO_REVIEW: 'true'
          GITHUB_ACTION_CONFIG__AUTO_IMPROVE: 'true'
          PR_CODE_SUGGESTIONS__COMMITTABLE_CODE_SUGGESTIONS: 'true'
